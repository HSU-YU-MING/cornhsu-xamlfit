name: Missed clipping — text is cut off and it said nothing
description: In the running app, text is clipped, hidden or pushed out of the window, and XamlFit didn't report it.
labels: ["missed"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — every layout rule in this tool was checked against real WPF, and a miss is how the next one
        gets found. Mask names freely.

        Write in English or 中文, whichever is easier.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the [existing issues](https://github.com/HSU-YU-MING/cornhsu-xamlfit/issues?q=is%3Aissue) and this hasn't been reported.
          required: true
        - label: I checked [Known limitations](https://github.com/HSU-YU-MING/cornhsu-xamlfit#known-limitations) — text set from code, triggers or visual states is a documented blind spot.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `xamlfit --version`
    validations:
      required: true

  - type: textarea
    id: reality
    attributes:
      label: What the running app shows
      description: A screenshot, the language, and the text that is cut off.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: The smallest XAML that reproduces it
      render: xml
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What XamlFit printed for that site, or the whole run
      description: If the site isn't mentioned at all, the first lines of the run (down to `resolution`) are the most useful part.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: participation
    attributes:
      label: Optional
      options:
        - label: I can run a build with a fix on my project to confirm it.
        - label: AI helped write this report, and I've checked it against what I actually ran.
