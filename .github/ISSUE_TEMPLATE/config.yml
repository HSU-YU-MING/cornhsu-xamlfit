# 檔名的數字前綴是排序用的：GitHub 照檔名字母排。順序是價值由高到低 ——「工具判斷錯了」比「工具壞了」值錢
# （同 XamlContrast、XamlKeys）。新增表單時記得加前綴，否則它會排到最前面。
#
# 空白 issue 保持開啟：表單不可能涵蓋所有情況，「沒有適合的表單」是人放棄回報最常見的理由。
#
# 2026-11-14 參考 Ruff、typescript-eslint、ESLint 的表單補了三樣：
#   搜尋過舊 issue 的勾選、「願意在自己的專案上試修正版」、AI 協助的聲明（後兩個不必填）。
blank_issues_enabled: true
contact_links:
  - name: Known limitations — check here first
    url: https://github.com/HSU-YU-MING/cornhsu-xamlfit#known-limitations
    about: Some gaps are deliberate and documented. Reports about them are still welcome — it just saves the diagnosis.
  - name: How to write a report that can be reproduced
    url: https://github.com/HSU-YU-MING/cornhsu-xamlfit/blob/main/CONTRIBUTING.md
    about: What to include, and why a report from a project I have never seen is worth more than a pull request.
  - name: Security issue — report privately
    url: https://github.com/HSU-YU-MING/cornhsu-xamlfit/security/advisories/new
    about: A crafted file that makes the tool hang, crash, or read or write outside its paths. Please don't open a public issue for these.
