name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  id-token: write   # NuGet Trusted Publishing（OIDC）需要

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # 版本號的唯一真相源是 tag。csproj 固定寫 0.0.0-dev，這裡覆寫。
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 套件推上去之前先抽好 Release 的內容：那之後才失敗就救不回來
      - run: bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

      - run: dotnet build XamlFit.slnx -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test XamlFit.slnx -c Release --no-build
      - run: bash scripts/verify-demo.sh
      - run: bash scripts/verify-budget.sh
      - run: bash scripts/verify-cli.sh

      - run: dotnet pack src/XamlFit.Cli/XamlFit.Cli.csproj -c Release -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

      # Trusted Publishing：OIDC 換臨時金鑰，沒有長效 API key、沒有 repo secret。
      # ⚠ 釘 commit SHA，不要改回 @v1。
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: Cornhsu

      - run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  # GitHub Release：使用者釘確切版本，Releases 頁是看得到「這版改了什麼」的地方。內容取自 CHANGELOG。
  # 另外一個 job：推套件的那個拿得到 OIDC，不需要能寫 repo；這個能寫 repo，拿不到 OIDC。
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          # 重跑 job 時更新既有的，不報錯
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
