name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # ⚠ Actions 一律釘 40 碼 commit SHA（2026-10 稽核的規矩）。
      #   dependabot 的 github-actions 會更新釘選；不要改回 @v4 這種移動 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XamlFit.slnx -c Release

      - name: Test
        run: dotnet test XamlFit.slnx -c Release --no-build

      # 很多 Linux CI 映像檔開著 globalization-invariant 模式：查不到任何文化資料。
      # 語言比對曾經因此在 Linux 上認不出 zh-TW（docs/M6-全面重讀.md #54）。
      - name: Test (globalization-invariant)
        run: dotnet test XamlFit.slnx -c Release --no-build
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'

      # 示範專案是**刻意做壞的**，所以預期 exit 1 —— 這正是守門員該有的行為。
      # 計數斷言同時驗證「工具真的會擋」跟「擋的數量沒有莫名其妙變動」。
      - name: Audit the demo (expects exit 1 and exact counts)
        run: bash scripts/verify-demo.sh

      - name: Budget mode on the demo
        run: bash scripts/verify-budget.sh

      # 每一條 CLI 路徑至少跑一次並斷言退出碼。單元測試測得到 Core，
      # 測不到「旗標有沒有接線」—— 實查到的兩個洞都只有真的跑才看得到。
      - name: CLI smoke test
        run: bash scripts/verify-cli.sh

      # README 的 Action 範例釘的版本要等於 CHANGELOG 最新的已發佈版本（0.3.0 發完才發現還釘著 0.1.0）
      - name: README pins the released version
        run: bash scripts/verify-readme-facts.sh

  # 真的跑一次 action.yml：單元測試只看得到文字，看不到 jq 註記、stop-commands、最後一步才擋有沒有接起來。
  # 裝的是**這個分支**打包出來的 CLI（本地 feed + nuget.config），不是 nuget.org 上的正式版 ——
  # Action 與 CLI 一起改的時候（0.5.0 的 --md）拿舊版 CLI 測新的 Action 會先壞在旗標上。
  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Pack this branch's CLI into a local feed
        run: |
          dotnet pack src/XamlFit.Cli/XamlFit.Cli.csproj -c Release -o ci-feed -p:Version=0.0.0-ci
          printf '<configuration><packageSources><add key="ci" value="ci-feed" /></packageSources></configuration>\n' > nuget.config

      # 示範專案是刻意做壞的：gate 一定要紅，而且報告與註記要在紅之前就出去
      - name: Run the action on the demo (expects the gate to fail)
        id: demo
        continue-on-error: true
        uses: ./
        with:
          root: samples/demo
          resx: samples/demo/Resources
          version: 0.0.0-ci
          artifact-name: xamlfit-demo-report
      - name: The gate failed and the reports were written
        env:
          OUTCOME: ${{ steps.demo.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "expected the demo to fail the gate, got $OUTCOME"; exit 1; }
          test -s "$RUNNER_TEMP/xamlfit-report.json" || { echo "no JSON report"; exit 1; }
          test -s "$RUNNER_TEMP/xamlfit-report.md" || { echo "no Markdown report"; exit 1; }
          n=$(jq '.findings | length' "$RUNNER_TEMP/xamlfit-report.json")
          test "$n" -gt 0 || { echo "the report has no findings"; exit 1; }
          p=$(jq '[.findings[] | select(.kind == "placeholder-mismatch")] | length' "$RUNNER_TEMP/xamlfit-report.json")
          test "$p" -eq 1 || { echo "expected 1 placeholder-mismatch, got $p"; exit 1; }
          echo "ok: gate failed, $n finding(s) in the report"

      # 壞的輸入要在裝任何東西之前 exit 2，不能變成預設值
      - name: A bad input is refused
        id: bad
        continue-on-error: true
        uses: ./
        with:
          root: samples/demo
          fail-on: Warn
          upload-report: false
      - name: The bad input failed the step
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "expected fail-on: Warn to be refused, got $OUTCOME"; exit 1; }

  # 分析是純算術，不相依 WPF —— 但使用者大多在 Windows 上跑（路徑分隔、大小寫不分的副檔名）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test XamlFit.slnx -c Release
