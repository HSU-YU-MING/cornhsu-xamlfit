name: 'XamlFit text-fit check'
description: 'Static text-fit check for WPF XAML: measures every translation against its slot without launching the app, fails the PR when a string does not fit, annotates the lines.'
author: 'Cornhsu'
branding:
  icon: 'maximize-2'
  color: 'blue'

# 形狀照 XamlContrast 的 action.yml（三件套要長得一樣，之後合併的 Action 才接得起來）：
#   inputs 先進 env 再用、先驗再裝、CLI 輸出包在 ::stop-commands:: 裡、報告與註記先出去、最後一步才依結論擋。
#   0.4.0 起 `sarif` 是開關（Action 自己上傳到 code scanning）、JSON 報告上傳成 artifact（upload-report／artifact-name），
#   不再收輸出路徑 —— 跟 XamlContrast 1.x 一致，那邊的 inputs 已經凍結、改不了。

inputs:
  root:
    description: 'Root directory of the project to scan (the one containing your XAML)'
    required: true
  working-directory:
    description: 'Directory to run in (`root`, `resx`, `metrics`, `baseline` and `config` are resolved relative to it)'
    required: false
    default: '.'
  version:
    description: 'Cornhsu.XamlFit tool version, such as 0.4.0 (default: the latest). The tool is 0.x: pin it, so a new release cannot change your build without a commit'
    required: false
    default: ''
  resx:
    description: 'Directory holding the .resx files (translations). Omit to use the config file''s resx, or to check the source language only'
    required: false
    default: ''
  pseudo:
    description: 'true: simulate expansion instead of using real translations (findings are reported one level lower and never fail the job)'
    required: false
    default: 'false'
  metrics:
    description: 'Path to the font metrics file (xamlfit.fonts.json.gz or xamlfit.fonts.json). Omit to use the config file''s metrics, else the file next to root'
    required: false
    default: ''
  config:
    description: 'Path to xamlfit.config.json (default: the file next to root)'
    required: false
    default: ''
  baseline:
    description: 'Path to a baseline file (ratchet mode: only new findings fail; the file must be committed to the repo)'
    required: false
    default: ''
  fail-on:
    description: 'fail: fail the job on fail-level findings only (the default); warn: also on warn-level ones. Omit to use the config file''s value, else fail'
    required: false
    default: ''
  min-coverage:
    description: 'Fail the job (exit 3) when fewer than this percentage (0-100) of measurable sites could be resolved. Omit to use the config file''s minCoverage, else 60; 0 disables'
    required: false
    default: ''
  upload-report:
    description: 'Upload the JSON report as an artifact named by artifact-name (default xamlfit-report)'
    required: false
    default: 'true'
  sarif:
    description: 'Upload SARIF to GitHub code scanning (requires security-events: write, plus GitHub Advanced Security or a public repo)'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the uploaded report artifact. Give every call its own name when the action runs more than once in a workflow run (a matrix, or two calls in one job). Letters, digits, ".", "_" and "-" only, 1-100 characters, not starting with "-" and not only dots'
    required: false
    default: 'xamlfit-report'

runs:
  using: 'composite'
  steps:
    # inputs 一律先進 env 再用 shell 變數引用，不直接 ${{ }} 內插進 run:。內插是 shell 看到指令之前的字串替換，
    # 呼叫端只要把 input 接到不可信的來源（例如 `root: ${{ github.event.issue.title }}`），那段內容就會變成 runner 上的指令。
    #
    # 先驗再用：壞值 → exit 2（與 CLI 的用法錯誤同一碼），在裝任何東西之前。訊息只點名 input，不印值。
    - name: Validate inputs
      shell: bash
      env:
        XF_ROOT: ${{ inputs.root }}
        XF_WORKDIR: ${{ inputs.working-directory }}
        XF_VERSION: ${{ inputs.version }}
        XF_RESX: ${{ inputs.resx }}
        XF_PSEUDO: ${{ inputs.pseudo }}
        XF_METRICS: ${{ inputs.metrics }}
        XF_CONFIG: ${{ inputs.config }}
        XF_BASELINE: ${{ inputs.baseline }}
        XF_FAIL_ON: ${{ inputs.fail-on }}
        XF_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XF_UPLOAD_REPORT: ${{ inputs.upload-report }}
        XF_SARIF: ${{ inputs.sarif }}
        XF_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        # 同一個 job 前一次呼叫留下的報告（$RUNNER_TEMP 共用）不能被這一次的註記與上傳撿去
        rm -f -- "$RUNNER_TEMP/xamlfit-report.json" "$RUNNER_TEMP/xamlfit.sarif"
        bad=0
        refuse() { echo "::error title=XamlFit action::$1"; bad=1; }
        # 帶換行的值一律拒絕：CLI／dotnet 的錯誤訊息會把它原樣印出，換行後的內容落在行首就成了
        # runner 會解析的 workflow command（::error …、::add-mask::）。這些值本來就跑不起來，提早擋不改變行為
        case "$XF_ROOT$XF_WORKDIR$XF_VERSION$XF_RESX$XF_METRICS$XF_CONFIG$XF_BASELINE$XF_MIN_COVERAGE" in
          *$'\n'* | *$'\r'*) refuse "root, working-directory, version, resx, metrics, config, baseline and min-coverage must not contain a line break" ;;
        esac
        # 以 - 開頭的路徑會被 CLI 當成旗標：root: --version 印版本、exit 0，什麼都沒稽核就綠燈。
        # Run check 另外以 -- 傳 root（雙重保險），這裡先點名擋下
        case "$XF_ROOT" in -*) refuse "root must not start with '-' (write ./-name for such a directory)" ;; esac
        for pair in "resx=$XF_RESX" "metrics=$XF_METRICS" "config=$XF_CONFIG" "baseline=$XF_BASELINE"; do
          case "${pair#*=}" in -*) refuse "${pair%%=*} must not start with '-' (write ./-name for such a path)" ;; esac
        done
        case "$XF_FAIL_ON" in
          '' | warn | fail) ;;
          *) refuse "fail-on must be 'fail', 'warn' or empty (the config file's value, else fail)" ;;
        esac
        # 範圍（0-100）交給 CLI 驗：超出範圍是 exit 2 並說明
        [[ "$XF_MIN_COVERAGE" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || refuse "min-coverage must be a number between 0 and 100, or empty"
        # artifact-name 會成為 artifact 名稱與 code scanning 的 category，只收安全的字元（比照 XamlContrast）。
        # bash 的 =~ 是整串比對，換行過不了
        if ! [[ "$XF_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || [[ "$XF_ARTIFACT_NAME" =~ ^-|^\.+$ ]]; then
          refuse "artifact-name must be 1-100 characters of A-Z, a-z, 0-9, '.', '_' or '-', not starting with '-' and not only dots"
        fi
        for pair in "pseudo=$XF_PSEUDO" "upload-report=$XF_UPLOAD_REPORT" "sarif=$XF_SARIF"; do
          case "${pair#*=}" in
            true | false) ;;
            *) refuse "${pair%%=*} must be 'true' or 'false'" ;;
          esac
        done
        if [ "$bad" -ne 0 ]; then exit 2; fi

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Install XamlFit
      shell: bash
      env:
        XF_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$XF_VERSION" ]; then
          dotnet tool install --global Cornhsu.XamlFit --version "$XF_VERSION"
        else
          # 0.x 沒有「只跟隨一個 major」的承諾可以給：不釘版本就是最新版。README 教使用者釘
          dotnet tool install --global Cornhsu.XamlFit
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    # 先跑、先產報告與註記，最後一步才依結論擋（讓失敗的 PR 也看得到完整輸出）
    - name: Run check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XF_ROOT: ${{ inputs.root }}
        XF_RESX: ${{ inputs.resx }}
        XF_PSEUDO: ${{ inputs.pseudo }}
        XF_METRICS: ${{ inputs.metrics }}
        XF_CONFIG: ${{ inputs.config }}
        XF_BASELINE: ${{ inputs.baseline }}
        XF_FAIL_ON: ${{ inputs.fail-on }}
        XF_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XF_SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        args=(check --json "$RUNNER_TEMP/xamlfit-report.json")
        [ "$XF_SARIF" = "true" ] && args+=(--sarif "$RUNNER_TEMP/xamlfit.sarif")
        [ -n "$XF_RESX" ]     && args+=(--resx "$XF_RESX")
        [ "$XF_PSEUDO" = "true" ] && args+=(--pseudo)
        [ -n "$XF_METRICS" ]  && args+=(--metrics "$XF_METRICS")
        [ -n "$XF_CONFIG" ]   && args+=(--config "$XF_CONFIG")
        [ -n "$XF_BASELINE" ] && args+=(--baseline "$XF_BASELINE")
        # gate 與覆蓋率下限：空白就不傳，交給 config（沒有就是內建預設）—— 旗標 > config > 預設
        [ -n "$XF_FAIL_ON" ]  && args+=(--fail-on "$XF_FAIL_ON")
        [ -n "$XF_MIN_COVERAGE" ] && args+=(--min-coverage "$XF_MIN_COVERAGE")
        # root 放在 -- 後面：之後的字一律是位置參數，以 - 開頭也不會被當成旗標
        args+=(-- "$XF_ROOT")
        # CLI 的輸出包在一次性 token 的 ::stop-commands:: 裡：被檢查的 XAML 與 .resx 是不可信的輸入，
        # 報告會把它們的字串原樣印出 —— 這段期間 runner 不解析任何 workflow command。token 每次隨機（固定的 token 可以被輸出內容提前關掉）
        token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        echo "::stop-commands::$token"
        xamlfit "${args[@]}"
        code=$?
        echo "::$token::"
        echo "exit=$code" >> "$GITHUB_OUTPUT"

    # 把放不下的位置直接標在 PR 的行上。等級：fail → error、warn → warning、info → notice（--pseudo 的全部降一級，CLI 已經降過）。
    # finding 的 site 是「root 相對、正斜線路徑:行號」；前綴 working-directory + root 即為 workspace 路徑。
    # 前綴組完要把 "./"、"/./"、重複的 "/" 收乾淨，否則 GitHub 對不上檔案 —— root 是 "." 時前綴是空的。
    - name: Annotate findings
      if: ${{ always() }}
      shell: bash
      env:
        XF_ROOT: ${{ inputs.root }}
        XF_WORKDIR: ${{ inputs.working-directory }}
      run: |
        report="$RUNNER_TEMP/xamlfit-report.json"
        [ -f "$report" ] || exit 0
        prefix=$(echo "$XF_WORKDIR/$XF_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        # workflow command 的跳脫（GitHub 規格）：訊息跳脫 % \r \n，屬性值（file=…）另外跳脫 : 與 ,。
        # 不跳脫的話，檔名裡一個逗號就把 file 屬性切斷、一個換行就讓後面的內容落在行首變成另一個 workflow command
        jq -r --arg root "$prefix" '
          def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
          .findings[]
          | (.site | capture("^(?<file>.*):(?<line>[0-9]+)$")) as $loc
          | (if .severity == "fail" then "error" elif .severity == "warn" then "warning" else "notice" end) as $level
          | "::\($level) file=\(($root + $loc.file) | prop),line=\($loc.line)::\("\(.kind) [\(.culture)] \(.key): needs \(.actualPx) px, has \(.limitPx) px\(if .warning then " (" + .warning + ")" else "" end)" | esc)"
        ' "$report" || true

    # SARIF 的路徑是 root 相對 —— 先補上前綴變成 repo 相對，code scanning 才對得上檔案
    - name: Make SARIF paths repo-relative
      if: ${{ always() && inputs.sarif == 'true' }}
      shell: bash
      env:
        XF_ROOT: ${{ inputs.root }}
        XF_WORKDIR: ${{ inputs.working-directory }}
      run: |
        f="$RUNNER_TEMP/xamlfit.sarif"
        [ -f "$f" ] || exit 0
        prefix=$(echo "$XF_WORKDIR/$XF_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        jq --arg root "$prefix" \
          '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ($root + .)' \
          "$f" > "$RUNNER_TEMP/xamlfit.repo.sarif"
        mv "$RUNNER_TEMP/xamlfit.repo.sarif" "$f"
    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true   # 無 Advanced Security 的私有 repo 會 403，不該紅掉整個 job
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ runner.temp }}/xamlfit.sarif
        # 同一個 run 用兩次時 code scanning 以 category 區分兩份分析（不給的話後一份蓋掉前一份）；預設名稱照舊不給
        category: ${{ inputs.artifact-name != 'xamlfit-report' && inputs.artifact-name || '' }}

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/xamlfit-report.json
        if-no-files-found: ignore

    # 報告與註記都出去了，現在才依 gate 結論決定 job 成敗
    - name: Enforce gate
      shell: bash
      env:
        XF_EXIT: ${{ steps.check.outputs.exit }}
      run: exit "$XF_EXIT"
