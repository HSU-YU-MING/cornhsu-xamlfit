name: 'XamlFit text-fit check'
description: 'Fails the build when a translated string does not fit its XAML slot.'
branding:
  icon: 'maximize-2'
  color: 'blue'

inputs:
  root:
    description: 'Directory to scan'
    required: true
  resx:
    description: 'Directory holding .resx files'
    required: false
  pseudo:
    description: 'Simulate expansion instead of using real translations'
    required: false
    default: 'false'
  metrics:
    description: 'Path to the metrics file (xamlfit.fonts.json.gz or xamlfit.fonts.json)'
    required: false
  baseline:
    description: 'Path to a baseline file'
    required: false
  fail-on:
    description: "'fail' (default) or 'warn'"
    required: false
    default: 'fail'
  min-coverage:
    description: 'Resolution floor; below it the run exits 3'
    required: false
    default: '60'
  json:
    description: 'Write the full report here'
    required: false
  sarif:
    description: 'Write a SARIF 2.1.0 report to this path (for github/codeql-action/upload-sarif)'
    required: false
  version:
    description: 'Version of Cornhsu.XamlFit to install, such as 0.1.0 (default: the latest). Pin it so a new release cannot change your build without a commit'
    required: false

runs:
  using: composite
  steps:
    # ⚠ 輸入一律走 env:，不要用 ${{ inputs.x }} 直接插進 run: 的腳本裡。
    #   那是文字替換 —— 帶引號或 $(…) 的輸入會變成可執行的程式碼（腳本注入）。
    #   GitHub 自己的文件就是這樣要求的。
    - name: Install XamlFit
      shell: bash
      env:
        XF_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$XF_VERSION" ]; then
          dotnet tool install -g Cornhsu.XamlFit --version "$XF_VERSION"
        else
          dotnet tool install -g Cornhsu.XamlFit
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Run XamlFit
      shell: bash
      env:
        XF_ROOT: ${{ inputs.root }}
        XF_RESX: ${{ inputs.resx }}
        XF_PSEUDO: ${{ inputs.pseudo }}
        XF_METRICS: ${{ inputs.metrics }}
        XF_BASELINE: ${{ inputs.baseline }}
        XF_FAIL_ON: ${{ inputs.fail-on }}
        XF_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XF_JSON: ${{ inputs.json }}
        XF_SARIF: ${{ inputs.sarif }}
      run: |
        args=(check --fail-on "$XF_FAIL_ON" --min-coverage "$XF_MIN_COVERAGE")
        [ -n "$XF_RESX" ]     && args+=(--resx "$XF_RESX")
        [ "$XF_PSEUDO" = "true" ] && args+=(--pseudo)
        [ -n "$XF_METRICS" ]  && args+=(--metrics "$XF_METRICS")
        [ -n "$XF_BASELINE" ] && args+=(--baseline "$XF_BASELINE")
        [ -n "$XF_JSON" ]     && args+=(--json "$XF_JSON")
        [ -n "$XF_SARIF" ]    && args+=(--sarif "$XF_SARIF")
        # ⚠ 路徑放在 -- 後面：叫 --version 的資料夾不會被當成旗標
        xamlfit "${args[@]}" -- "$XF_ROOT"
